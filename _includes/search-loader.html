<!--
  Jekyll Simple Search loader
  See: <https://github.com/christian-fei/Simple-Jekyll-Search>
-->

{% capture result_elem %}
  <article class="px-1 px-sm-2 px-lg-4 px-xl-0">
    <header>
      <h2><a href="{url}">{title}</a></h2>
      <div class="post-meta d-flex flex-column flex-sm-row text-muted mt-1 mb-1">
        {categories}
        {tags}
      </div>
    </header>
    <p>{content}</p>
  </article>
{% endcapture %}

{% capture not_found %}<p class="mt-5">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script>
  document.addEventListener('DOMContentLoaded', function () {
    SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('search-results'),
      json: '{{ '/assets/js/data/search.json' | relative_url }}',
      searchResultTemplate: '{{ result_elem | strip_newlines }}',
      noResultsText: '{{ not_found }}',
      limit: 100,
      templateMiddleware: function (prop, value, template) {
        if (prop === 'categories') {
          if (value === '') {
            return value;
          }
          return '<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>' + value + '</div>';
        }
        if (prop === 'tags') {
          if (value === '') {
            return value;
          }
          return '<div><i class="fa fa-tag fa-fw"></i>' + value + '</div>';
        }
      }
    });

    var resultsContainer = document.getElementById('search-results');
    var tip = document.getElementById('search-limit-tip');
    var countEl = document.getElementById('search-limit-count');
    var hintEl = document.getElementById('search-limit-hint');
    var searchInput = document.getElementById('search-input');

    if (resultsContainer && tip && countEl && hintEl) {
      var updateTip = function () {
        var count = resultsContainer.querySelectorAll('article').length;
        if (count > 0) {
          tip.style.display = 'block';
          countEl.textContent = '搜尋結果最多顯示 100 筆，以上共顯示 ' + count + ' 筆';
          if (count >= 100) {
            hintEl.style.display = 'block';
          } else {
            hintEl.style.display = 'none';
          }
        } else {
          tip.style.display = 'none';
          hintEl.style.display = 'none';
        }
      };

      var observer = new MutationObserver(updateTip);
      observer.observe(resultsContainer, { childList: true, subtree: true });

      if (searchInput) {
        searchInput.addEventListener('input', function () {
          setTimeout(updateTip, 50);
        });
      }
    }
  });
</script>
