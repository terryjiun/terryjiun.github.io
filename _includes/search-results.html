<!-- The Search results -->
<div id="search-result-wrapper" class="d-flex justify-content-center d-none">
  <div class="col-11 content">
    <div id="search-hints">
      {% include_cached trending-tags.html lang=include.lang %}
    </div>

    <div id="search-results" class="d-flex flex-wrap justify-content-center text-muted mt-3"></div>

    <div id="search-limit-tip" class="text-center mt-3 mb-5" style="display: none;">
      <p id="search-limit-count" class="text-muted mb-2" style="font-size: 0.9rem;"></p>
      <p id="search-limit-hint" class="mb-0" style="display: none; font-size: 1.05rem; color: #dc3545; font-weight: 600;">
        請改用較精準之關鍵字進行搜尋！
      </p>
    </div>
  </div>
</div>
